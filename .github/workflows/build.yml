name: 跨平台打包

# 触发方式：
#   - 手动点按钮（workflow_dispatch）
#   - push 到 main 分支
#   - push v* 标签（发版时）
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

# 同一分支的新 push 会取消还在跑的旧构建，省 minutes
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false          # 一个平台失败不影响其它平台继续
      matrix:
        include:
          - os: windows-latest   # x86_64，对应绝大多数普通 Windows 电脑
            label: Windows-x86_64
            artifact: AI_chat-Windows-x86_64
          - os: ubuntu-latest    # x86_64
            label: Linux-x86_64
            artifact: AI_chat-Linux-x86_64
          - os: macos-latest     # arm64（Apple Silicon）；要 Intel 版见 docs/CI_BUILD.md
            label: macOS-arm64
            artifact: AI_chat-macOS-arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # PySide6 6.12 在各平台都有 cp312 wheel，最稳
          cache: 'pip'

      # QtWebEngine（Chromium）在 Linux 上要链接一批系统库，缺了构建/运行都会崩。
      # 这些是"运行时系统依赖"，无法冻结进包，故构建机需自备。
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libgl1 libegl1 libfontconfig1 libfreetype6 \
            libx11-6 libx11-xcb1 libxcb1 libxext6 libxfixes3 libxi6 \
            libxrender1 libxtst6 libxcomposite1 libxdamage1 libxrandr2 \
            libxcursor1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libnss3 libnspr4 libgbm1 libxcb-cursor0 \
            fonts-noto-cjk
          # ubuntu 24.04 起 alsa 包名带 t64 后缀，两种都兜一下
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: 安装 Python 依赖（版本已锁定）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PyInstaller 构建
        id: build
        run: pyinstaller AI_chat.spec --noconfirm --clean

      # ---- 产物校验：确认主程序和 WebEngine 组件都打进去了 ----
      - name: 校验产物（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          test -f "dist/AI_chat/AI_chat.exe" && echo "OK 主程序 AI_chat.exe"
          find dist/AI_chat -iname 'QtWebEngineProcess.exe' | grep -q . && echo "OK QtWebEngineProcess.exe"
          find dist/AI_chat -iname 'qtwebengine_resources*.pak' | grep -q . && echo "OK WebEngine 资源 .pak"
          find dist/AI_chat -iname 'icudtl.dat' | grep -q . && echo "OK icudtl.dat"

      - name: 校验产物（Linux）
        if: runner.os == 'Linux'
        run: |
          set -e
          test -x "dist/AI_chat/AI_chat" && echo "OK 主程序 AI_chat"
          find dist/AI_chat -name 'QtWebEngineProcess' | grep -q . && echo "OK QtWebEngineProcess"
          find dist/AI_chat -name 'qtwebengine_resources*.pak' | grep -q . && echo "OK WebEngine 资源 .pak"
          find dist/AI_chat -name 'icudtl.dat' | grep -q . && echo "OK icudtl.dat"

      - name: 校验产物（macOS）
        if: runner.os == 'macOS'
        run: |
          set -e
          test -x "dist/AI Chat.app/Contents/MacOS/AI_chat" && echo "OK 主程序 .app"
          find "dist/AI Chat.app" -name 'QtWebEngineProcess' | grep -q . && echo "OK QtWebEngineProcess"
          find "dist/AI Chat.app" -name 'qtwebengine_resources*.pak' | grep -q . && echo "OK WebEngine 资源 .pak"

      # ---- 打包成单个归档，方便下载（先打包上传，再做冒烟测试，
      #      这样即使冒烟失败，产物也已可供下载排查）----
      - name: 打包（Windows → zip）
        if: runner.os == 'Windows' && steps.build.outcome == 'success'
        shell: pwsh
        run: Compress-Archive -Path 'dist\AI_chat' -DestinationPath '${{ matrix.artifact }}.zip' -Force

      - name: 打包（Linux → tar.gz）
        if: runner.os == 'Linux' && steps.build.outcome == 'success'
        run: tar -czf "${{ matrix.artifact }}.tar.gz" -C dist AI_chat

      - name: 打包（macOS → zip，ditto 保留 .app 软链与权限）
        if: runner.os == 'macOS' && steps.build.outcome == 'success'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/AI Chat.app" "${{ matrix.artifact }}.zip"

      - name: 上传产物
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 30

      # ---- Linux 无头启动冒烟：进程能存活即视为启动正常 ----
      # offscreen 模式下 WebEngine 会刷一堆 Skia/GPU 报错，那是无头渲染的正常噪音，
      # 判定标准是"进程是否存活"，不是"有没有 stderr 输出"。
      - name: 启动冒烟测试（Linux offscreen）
        if: runner.os == 'Linux' && steps.build.outcome == 'success'
        run: |
          QT_QPA_PLATFORM=offscreen QTWEBENGINE_DISABLE_SANDBOX=1 \
            ./dist/AI_chat/AI_chat > /tmp/run.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            echo "OK 进程存活 20s，启动正常"
            kill "$PID" 2>/dev/null || true
          else
            echo "FAIL 进程提前退出，日志如下："
            cat /tmp/run.log
            exit 1
          fi
