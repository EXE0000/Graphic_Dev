<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chat · Web</title>
<link rel="stylesheet" href="/static/vendor/katex.min.css">
<link rel="stylesheet" href="/static/css/chat.css">
<link rel="stylesheet" href="/static/css/webchat.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <button class="new-conv" id="new-conv">＋ 新建对话</button>
    <div class="conv-search-wrap">
      <input class="conv-search" id="conv-search" placeholder="搜索对话…">
      <button class="conv-search-clear" id="conv-search-clear" hidden
              title="清空搜索">✕</button>
    </div>
    <div class="conv-bar">
      <button class="mini" id="conv-manage">管理</button>
      <button class="mini danger" id="conv-delete-selected" hidden>删除选中 (0)</button>
      <button class="mini" id="conv-delete-empty" hidden>删除空对话</button>
      <button class="mini" id="conv-cancel-manage" hidden>取消</button>
    </div>
    <div class="conv-list" id="conv-list"></div>
  </aside>

  <div class="main">
<header class="topbar">
  <button class="ghost icon" id="toggle-sidebar" title="收起/展开侧边栏">☰</button>
  <div class="brand">AI Chat <span class="badge">Web</span></div>
  <div class="meta" id="meta">连接中…</div>
  <label class="toggle"><input type="checkbox" id="toggle-search"> 联网搜索</label>
  <label class="reasoning" title="推理强度：越高越慢但更仔细；本地模型默认可能很高，调低会明显变快">
    <span>推理</span>
    <input type="range" id="reasoning-range" min="0" max="3" step="1" value="2">
    <span id="reasoning-label" class="reasoning-label">中</span>
  </label>
  <select class="fmt" id="export-fmt" title="导出格式">
    <option value="md">Markdown</option>
    <option value="docx">Word</option>
    <option value="pdf">PDF</option>
    <option value="xlsx">Excel</option>
  </select>
  <button class="ghost" id="export-all" title="导出整段对话">导出对话</button>
  <button class="ghost" id="manage" title="批量选择并删除">管理</button>
  <button class="ghost danger" id="delete-selected" hidden>删除选中 (0)</button>
  <button class="ghost" id="cancel-manage" hidden>取消</button>
  <button class="ghost" id="reset" title="清空这段对话">清空</button>
</header>

<main id="chat" class="chat-scroll"></main>
<button id="jump-latest-web" class="jump-latest" hidden>↓ 回到最新</button>

<div id="pending" class="pending"></div>

<footer class="composer">
  <label class="attach" title="添加附件（图片 / PDF / DOCX / MD / TXT）">
    📎
    <input type="file" id="file" multiple hidden>
  </label>
  <textarea id="input" rows="1"
            placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
  <button id="send" class="primary">发送</button>
</footer>
  </div>
</div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/katex.min.js"></script>
<script src="/static/vendor/auto-render.min.js"></script>
<script src="/static/js/webchat.js"></script>
</body>
</html>
