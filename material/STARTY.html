<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARTY</title>
<style>
    /* ==========================================================
       1. 设计变量
       ========================================================== */
    :root {
        --bg: #272727;              /* 页面底色 */
        --surface: #3f3f3f;         /* 导航条 / 胶囊按钮 / 命令框 */
        --surface-hover: #4a4a4a;   /* 悬停态 */
        --surface-soft: #2b2b2b;    /* 选中态（更暗） */
        --strip: #333333;           /* 命令框内的文件条 */
        --chip: #575757;            /* 文件标签 */
        --light: #cfcfcf;           /* 浅色控件（模型值、开关、发送键） */
        --light-hover: #e9e9e9;
        --text: #f2f2f2;
        --text-dim: #b6b6b6;
        --text-faint: #858585;
        --border: #575757;          /* 左侧面板描边 */
        --radius-panel: 40px;
        --radius-pill: 999px;
        --shadow-pop: 0 20px 45px rgba(0, 0, 0, .5);
        --ease: cubic-bezier(.22, .61, .36, 1);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        height: 100%;
    }

    body {
        background-color: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        font-size: 14px;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
    }

    button,
    textarea {
        font: inherit;
        color: inherit;
    }

    button {
        border: 0;
        background: none;
        cursor: pointer;
    }

    svg {
        display: block;
    }

    ::selection {
        background: #6f6f6f;
        color: #fff;
    }

    /* ==========================================================
       2. 页面大框架：左侧边栏 + 右侧对话区
       ========================================================== */
    .app {
        display: flex;
        height: 100vh;
        height: 100dvh;
        gap: 20px;
        padding: 20px;
    }

    .sidebar {
        flex: 0 0 450px;
        min-width: 280px;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .main {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    /* ==========================================================
       3. 左侧边栏
       ========================================================== */
    .sidebar-panel {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 14px 16px 16px;
        border: 2px solid var(--border);
        border-radius: var(--radius-panel);
    }

    /* 3.1 面板顶部：新对话 */
    .panel-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2px 0 14px;
    }

    .new-chat-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 44px;
        padding: 0 24px;
        border-radius: var(--radius-pill);
        background-color: #505050;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        transition: background-color .2s var(--ease), transform .12s var(--ease);
    }

    .new-chat-btn:hover { background-color: #5d5d5d; }
    .new-chat-btn:active { transform: scale(.96); }

    .new-chat-btn svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
    }

    /* 3.2 面板内容：三个 Tab 页面 */
    .panel-body {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
    }

    .tab-panel {
        display: none;                 /* 默认隐藏 */
        flex: 1 1 auto;
        min-height: 0;
        flex-direction: column;
        padding: 2px 4px 4px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #5f5f5f transparent;
    }

    .tab-panel.is-active {
        display: flex;                 /* JS 切换 .is-active */
    }

    .tab-panel::-webkit-scrollbar { width: 4px; }
    .tab-panel::-webkit-scrollbar-thumb {
        background: #5f5f5f;
        border-radius: 999px;
    }

    .panel-title {
        flex: 0 0 auto;
        padding: 4px 10px 10px;
        color: var(--text-faint);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: .04em;
    }

    /* 3.3 空状态 */
    .empty-state {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px 20px 48px;
        text-align: center;
        color: var(--text-faint);
    }

    .empty-state__icon {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background-color: #303030;
        color: #909090;
    }

    .empty-state__icon svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .empty-state h3 {
        color: #c9c9c9;
        font-size: 14px;
        font-weight: 600;
    }

    .empty-state p {
        max-width: 240px;
        color: #7d7d7d;
        font-size: 12px;
        line-height: 1.7;
    }

    /* 3.4 底部导航 */
    .sidebar-nav {
        flex: 0 0 78px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px;
        background-color: var(--surface);
        border-radius: var(--radius-pill);
    }

    .nav-tabs {
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .nav-tab {
        flex: 1 1 0;
        min-width: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        border-radius: var(--radius-pill);
        color: #e7e7e7;
        transition: background-color .2s var(--ease), color .2s var(--ease), transform .12s var(--ease);
    }

    .nav-tab:hover { background-color: var(--surface-hover); }
    .nav-tab:active { transform: scale(.97); }

    .nav-tab.is-active {
        background-color: var(--surface-soft);
        color: #fff;
    }

    .nav-tab__icon {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
    }

    .nav-tab__icon svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .nav-tab__label {
        font-size: 11.5px;
        line-height: 1;
        letter-spacing: .02em;
    }

    .nav-avatar {
        flex: 0 0 64px;
        width: 64px;
        height: 100%;
        display: grid;
        place-items: center;
        border-radius: var(--radius-pill);
        background-color: #474747;
        color: #d7d7d7;
        transition: background-color .2s var(--ease), transform .12s var(--ease);
    }

    .nav-avatar:hover { background-color: #565656; }
    .nav-avatar:active { transform: scale(.96); }

    .nav-avatar svg {
        width: 30px;
        height: 30px;
        fill: currentColor;
    }

    /* ==========================================================
       4. 右侧：对话舞台
       ========================================================== */
    .chat-stage {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: hidden;
    }

    .greeting {
        text-align: center;
        user-select: none;
    }

    .greeting__title {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(10px, 1.2vw, 22px);
        color: #414141;
        font-size: clamp(30px, 3.6vw, 56px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: .02em;
        white-space: nowrap;
    }

    /* 项目 Logo：宽高比与 viewBox 一致，尺寸/颜色都跟随标题 */
    .greeting__logo {
        flex: 0 0 auto;
        width: 4.567em;
        height: 1em;
        fill: currentColor;
    }

    .greeting p {
        margin-top: 10px;
        color: #383838;
        font-size: clamp(13px, 1.2vw, 18px);
    }

    /* ==========================================================
       5. 右侧：底部工具区
       ========================================================== */
    .composer-dock {
        flex: 0 0 auto;
        align-self: center;
        width: 100%;
        max-width: 818px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    /* 5.1 胶囊栏 */
    .toolbar {
        width: min(620px, 100%);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .tool {
        position: relative;
        display: flex;
        flex: 1 1 0;
        min-width: 120px;
    }

    .tool--model {
        flex: 1.4 1 0;
        min-width: 170px;
    }

    .tool--level {
        flex: 1.15 1 0;
        min-width: 130px;
    }

    .tool__trigger {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 40px;
        padding: 0 6px 0 14px;
        border-radius: var(--radius-pill);
        background-color: var(--surface);
        color: #e9e9e9;
        font-size: 13px;
        transition: background-color .18s var(--ease);
    }

    .tool__trigger:hover { background-color: var(--surface-hover); }
    .tool.is-open .tool__trigger { background-color: var(--surface-hover); }

    .tool__label {
        flex: 0 0 auto;
        color: #dcdcdc;
        font-size: 12.5px;
    }

    /* 胶囊右侧的浅色当前值 */
    .tool__value {
        display: flex;
        align-items: center;
        gap: 2px;
        min-width: 0;
        max-width: calc(100% - 46px);
        height: 28px;
        margin-left: auto;
        padding: 0 4px 0 12px;
        border-radius: var(--radius-pill);
        background-color: var(--light);
        color: #262626;
        font-size: 12px;
        font-weight: 600;
    }

    .tool__value-text {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .tool__caret {
        flex: 0 0 12px;
        width: 12px;
        height: 12px;
        fill: currentColor;
        opacity: .75;
    }

    /* 5.2 开关 */
    .switch {
        position: relative;
        flex: 0 0 42px;
        width: 42px;
        height: 24px;
        margin-left: auto;
        border-radius: var(--radius-pill);
        background-color: #6a6a6a;
        transition: background-color .22s var(--ease);
    }

    .switch__knob {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background-color: #e2e2e2;
        transition: transform .22s var(--ease), background-color .22s var(--ease);
    }

    .tool--switch.is-on .switch { background-color: var(--light); }

    .tool--switch.is-on .switch__knob {
        transform: translateX(18px);
        background-color: #2b2b2b;
    }

    .tool--switch.is-on .tool__label { color: #fff; }

    /* 5.3 上拉菜单 */
    .popover {
        position: absolute;
        left: 0;
        bottom: calc(100% + 10px);
        z-index: 50;
        display: none;
        width: 250px;
        max-width: min(250px, calc(100vw - 48px));
        padding: 8px;
        border: 1px solid #4f4f4f;
        border-radius: 18px;
        background-color: #2f2f2f;
        box-shadow: var(--shadow-pop);
    }

    .popover.is-open {
        display: block;
        animation: popover-in .16s var(--ease);
    }

    .tool--level .popover {
        left: auto;
        right: 0;
    }

    @keyframes popover-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .popover__title {
        padding: 6px 10px 8px;
        color: #8d8d8d;
        font-size: 11px;
        letter-spacing: .04em;
    }

    .popover__option {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 9px 10px;
        border-radius: 12px;
        color: #d6d6d6;
        font-size: 13px;
        text-align: left;
        transition: background-color .15s var(--ease), color .15s var(--ease);
    }

    .popover__option:hover,
    .popover__option.is-selected {
        background-color: #3d3d3d;
        color: #fff;
    }

    .popover__check {
        width: 14px;
        height: 14px;
        margin-left: auto;
        fill: none;
        stroke: var(--light);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
    }

    .popover__option.is-selected .popover__check { opacity: 1; }

    /* 5.4 命令框 */
    .composer {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
        padding: 10px 14px 12px 16px;
        border-radius: 30px;
        background-color: var(--surface);
        transition: background-color .2s var(--ease);
    }

    .composer:focus-within { background-color: #434343; }

    .file-strip {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        min-height: 40px;
        padding: 5px 5px 5px 8px;
        border-radius: var(--radius-pill);
        background-color: var(--strip);
    }

    .file-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 8px 0 12px;
        border-radius: var(--radius-pill);
        background-color: var(--chip);
        color: #ececec;
        font-size: 12px;
        white-space: nowrap;
    }

    .file-chip__check {
        width: 15px;
        height: 15px;
        flex: 0 0 15px;
    }

    .add-file {
        display: grid;
        place-items: center;
        flex: 0 0 30px;
        width: 30px;
        height: 30px;
        margin-left: auto;
        border-radius: 50%;
        background-color: var(--light);
        color: #272727;
        transition: background-color .2s var(--ease), transform .12s var(--ease);
    }

    .add-file:hover { background-color: #fff; }
    .add-file:active { transform: scale(.86); }

    .add-file svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linecap: round;
    }

    .composer-row {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        padding: 2px 2px 0 6px;
    }

    .composer-input {
        flex: 1 1 auto;
        min-width: 0;
        height: 35px;
        min-height: 35px;
        max-height: 150px;
        padding: 6px 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font-size: 15px;
        line-height: 1.55;
        resize: none;
        overflow-y: hidden;
        scrollbar-width: none;
    }

    .composer-input::-webkit-scrollbar { width: 0; height: 0; }
    .composer-input::placeholder { color: #8f8f8f; }

    .send-btn {
        display: grid;
        place-items: center;
        flex: 0 0 48px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background-color: var(--light);
        color: #2b2b2b;
        transition: background-color .2s var(--ease), transform .12s var(--ease);
    }

    .send-btn:hover { background-color: #fff; }
    .send-btn:active { transform: scale(.9); }

    .send-btn svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    /* 键盘可达性 */
    :focus-visible {
        outline: 2px solid rgba(207, 207, 207, .85);
        outline-offset: 2px;
    }

    .composer-input:focus-visible,
    .popover__option:focus-visible {
        outline: none;
    }

    /* ==========================================================
       6. 响应式加固
       ========================================================== */
    @media (max-width: 1200px) {
        .sidebar { flex-basis: 380px; }
    }

    @media (max-width: 1000px) {
        .app { gap: 14px; padding: 14px; }
        .sidebar { flex-basis: 320px; min-width: 260px; }
        .toolbar { width: 100%; }
        .tool__trigger { padding-left: 10px; font-size: 12px; }
        .tool__label { font-size: 11.5px; }
    }

    @media (max-width: 820px) {
        body { overflow: auto; }
        .app {
            flex-direction: column;
            height: auto;
            min-height: 100dvh;
            padding: 12px;
            gap: 12px;
        }
        .sidebar {
            flex: 0 0 auto;
            height: min(48vh, 400px);
            min-width: 0;
        }
        .sidebar-nav { flex-basis: 68px; }
        .main { flex: 1 1 auto; min-height: 460px; }
        .chat-stage { flex: 1 1 120px; padding: 8px; }
        .greeting { display: none; }
        .composer-dock { max-width: 100%; }
        .toolbar { max-width: 100%; }
    }

    @media (max-width: 480px) {
        .sidebar { height: min(52vh, 380px); }
        .sidebar-nav { gap: 6px; flex-basis: 64px; }
        .nav-avatar { flex-basis: 52px; width: 52px; }
        .nav-tabs { gap: 6px; }
        .nav-tab__label { font-size: 10.5px; }
        .nav-tab__icon,
        .nav-tab__icon svg { width: 20px; height: 20px; }
        .composer { padding: 8px 10px 10px 12px; border-radius: 26px; }
        .tool { min-width: 108px; }
        .tool--model { min-width: 150px; }
    }

    @media (max-height: 640px) {
        .greeting { display: none; }
        .sidebar-nav { flex-basis: 68px; }
        .panel-header { padding-bottom: 8px; }
        .new-chat-btn { height: 38px; font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
        * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
</style>
</head>
<body>

<div class="app">

    <!-- ===================== 左侧边栏 ===================== -->
    <aside class="sidebar">

        <!-- 面板：新对话 + 三个 Tab 页面 -->
        <div class="sidebar-panel">

            <div class="panel-header">
                <button class="new-chat-btn" id="newChatBtn" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    <span>新对话</span>
                </button>
            </div>

            <div class="panel-body">

                <!-- 历史记录面板 -->
                <section class="tab-panel is-active" id="panel-history" data-panel="history"
                         role="tabpanel" aria-labelledby="tab-history">
                    <h2 class="panel-title">历史记录</h2>
                    <div class="empty-state">
                        <span class="empty-state__icon">
                            <!-- 占位图标：后续可整体替换 svg 内部内容 -->
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="8.5"/>
                                <path d="M12 7.5V12l3 2"/>
                            </svg>
                        </span>
                        <h3>还没有历史对话</h3>
                        <p>开始一段新对话后，这里会按时间记录你的聊天。</p>
                    </div>
                </section>

                <!-- 知识库面板 -->
                <section class="tab-panel" id="panel-knowledge" data-panel="knowledge"
                         role="tabpanel" aria-labelledby="tab-knowledge">
                    <h2 class="panel-title">知识库</h2>
                    <div class="empty-state">
                        <span class="empty-state__icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/>
                                <path d="M4 20.5V5.5"/>
                                <path d="M8 7h8"/>
                            </svg>
                        </span>
                        <h3>知识库还是空的</h3>
                        <p>之后可以在这里上传资料，让 STARTY 参考它们回答你。</p>
                    </div>
                </section>

                <!-- 笔记面板 -->
                <section class="tab-panel" id="panel-notes" data-panel="notes"
                         role="tabpanel" aria-labelledby="tab-notes">
                    <h2 class="panel-title">笔记</h2>
                    <div class="empty-state">
                        <span class="empty-state__icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 20l4.6-1.1 10.9-10.9a2.2 2.2 0 0 0-3.1-3.1L5.5 15.8 4 20z"/>
                                <path d="M14.9 6.4l2.7 2.7"/>
                            </svg>
                        </span>
                        <h3>还没有笔记</h3>
                        <p>把对话里的灵感记下来，方便以后翻看和整理。</p>
                    </div>
                </section>

            </div>
        </div>

        <!-- 底部导航 -->
        <nav class="sidebar-nav" aria-label="侧边栏导航">

            <div class="nav-tabs" role="tablist" aria-label="侧边栏页面">

                <button class="nav-tab is-active" id="tab-history" data-tab="history"
                        type="button" role="tab" aria-selected="true" aria-controls="panel-history">
                    <span class="nav-tab__icon">
                        <!-- 占位图标：把下方 path 换成自己的 SVG 即可 -->
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="8.5"/>
                            <path d="M12 7.5V12l3 2"/>
                        </svg>
                    </span>
                    <span class="nav-tab__label">历史记录</span>
                </button>

<script>
/* ============================================================
   纯前端交互脚本（无任何业务逻辑、无第三方库）
   1. 左侧导航 Tab 切换
   2. 思考模式 / 联网模式 开关
   3. 模型 / 推理等级 上拉菜单
   4. 输入框高度自适应
   5. 按钮点击反馈与日志
   ============================================================ */
(function () {
    'use strict';

    /* --------------------------------------------------------
       1. 左侧导航 Tab 切换
       -------------------------------------------------------- */
    var navTabs = Array.prototype.slice.call(document.querySelectorAll('.nav-tab'));
    var tabPanels = Array.prototype.slice.call(document.querySelectorAll('.tab-panel'));

    function activateTab(tabName) {
        navTabs.forEach(function (tab) {
            var isActive = tab.dataset.tab === tabName;
            tab.classList.toggle('is-active', isActive);
            tab.setAttribute('aria-selected', String(isActive));
        });

        tabPanels.forEach(function (panel) {
            var isActive = panel.dataset.panel === tabName;
            panel.classList.toggle('is-active', isActive);
            if (!isActive) { panel.scrollTop = 0; }
        });
    }

    navTabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
            activateTab(tab.dataset.tab);
        });
    });

    /* --------------------------------------------------------
       2. 开关按钮：切换 .is-on，圆点左右滑动由 CSS 完成
       -------------------------------------------------------- */
    var switchButtons = Array.prototype.slice.call(
        document.querySelectorAll('.tool--switch .tool__trigger')
    );

    switchButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
            var tool = btn.closest('.tool--switch');
            var isOn = tool.classList.toggle('is-on');
            btn.setAttribute('aria-checked', String(isOn));
        });
    });

    /* --------------------------------------------------------
       3. 上拉菜单：再次点击 / 点击外部 / 按 Esc 均可收起
       -------------------------------------------------------- */
    var menuTools = Array.prototype.slice.call(document.querySelectorAll('.tool--menu'));

    function closeAllMenus() {
        menuTools.forEach(function (tool) {
            tool.classList.remove('is-open');
            tool.querySelector('.popover').classList.remove('is-open');
            tool.querySelector('.tool__trigger').setAttribute('aria-expanded', 'false');
        });
    }

    menuTools.forEach(function (tool) {
        var trigger = tool.querySelector('.tool__trigger');
        var popover = tool.querySelector('.popover');

        trigger.addEventListener('click', function (event) {
            event.stopPropagation();
            var shouldOpen = !tool.classList.contains('is-open');

            closeAllMenus();

            if (shouldOpen) {
                tool.classList.add('is-open');
                popover.classList.add('is-open');
                trigger.setAttribute('aria-expanded', 'true');
            }
        });

        // 点击面板空白处不关闭，方便以后往面板里加内容
        popover.addEventListener('click', function (event) {
            event.stopPropagation();
        });

        // 选择一个假选项：更新胶囊上的文字与选中态（仅 UI）
        Array.prototype.forEach.call(
            popover.querySelectorAll('.popover__option'),
            function (option) {
                option.addEventListener('click', function () {
                    Array.prototype.forEach.call(
                        popover.querySelectorAll('.popover__option'),
                        function (item) {
                            item.classList.remove('is-selected');
                            item.setAttribute('aria-selected', 'false');
                        }
                    );

                    option.classList.add('is-selected');
                    option.setAttribute('aria-selected', 'true');

                    tool.querySelector('.tool__value-text').textContent =
                        option.dataset.value || option.textContent.trim();

                    closeAllMenus();
                    trigger.focus();
                });
            }
        );
    });

    // 点击页面其它地方时收起所有上拉菜单
    document.addEventListener('click', closeAllMenus);

    // Esc 收起
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') { closeAllMenus(); }
    });

    /* --------------------------------------------------------
       4. 输入框随内容自动撑高
       -------------------------------------------------------- */
    var input = document.getElementById('composerInput');
    var INPUT_MAX_HEIGHT = 150;   // 与 CSS 的 max-height 保持一致

    function autoGrow() {
        input.style.height = 'auto';
        var targetHeight = Math.min(input.scrollHeight, INPUT_MAX_HEIGHT);
        input.style.height = targetHeight + 'px';
        input.style.overflowY = input.scrollHeight > INPUT_MAX_HEIGHT ? 'auto' : 'hidden';
    }

    input.addEventListener('input', autoGrow);
    window.addEventListener('resize', autoGrow);
    autoGrow();   // 初始化一次，修正占位符状态下的高度

    /* --------------------------------------------------------
       5. 按钮点击态 + 控制台日志（不接任何真实逻辑）
       -------------------------------------------------------- */
    document.getElementById('sendBtn').addEventListener('click', function () {
        console.log('点击了发送');
    });

    document.getElementById('addFileBtn').addEventListener('click', function () {
        console.log('点击了添加文件');
    });

    document.getElementById('newChatBtn').addEventListener('click', function () {
        console.log('点击了新对话');
        // 仅清空输入框这个“假动作”，方便反复演示
        input.value = '';
        autoGrow();
        input.focus();
    });

    document.getElementById('profileBtn').addEventListener('click', function () {
        console.log('点击了个人中心');
    });

})();
</script>
